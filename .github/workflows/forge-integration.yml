name: Real Forge integration
on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T forge-runner node scripts/bridge-smoke.mjs
      - run: mkdir -p data
      - run: docker compose cp forge-runner:/tmp/bridge-report.json data/bridge-smoke.json
      - run: node scripts/smoke.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/commander-smoke.mjs
      - run: node scripts/pods-smoke.mjs
      - run: node scripts/pods-browser.mjs
      - run: node scripts/formats-smoke.mjs
      - run: node scripts/formats-browser.mjs
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-evidence
          path: |
            compose.log
            data/smoke-report.json
            data/browser/
            data/formats-smoke.json
            data/bridge-smoke.json
            data/pods-smoke.json
      - if: always()
        run: docker compose down
