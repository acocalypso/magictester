name: Real Forge integration
on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "ADMIN_TOKEN="+require("crypto").randomBytes(32).toString("hex")+"\n")'
      - run: docker compose up --build -d --wait
      - run: mkdir -p data
      - run: docker compose exec -T forge-runner node scripts/runtime-pinning-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/runtime-pinning.json > data/runtime-pinning.json
      - run: docker compose exec -T forge-runner node scripts/bridge-smoke.mjs

      - run: docker compose exec -T forge-runner cat /tmp/bridge-report.json > data/bridge-smoke.json
      - run: docker compose run --rm --no-deps bootstrap node scripts/run-engine-contract.mjs DuelContracts
      - run: docker compose run --rm --no-deps bootstrap node scripts/run-engine-contract.mjs MatchContracts
      - run: docker compose run --rm --no-deps bootstrap node scripts/run-engine-contract.mjs CommanderColorContracts
      - run: docker compose run --rm --no-deps bootstrap node scripts/run-engine-contract.mjs DeckNameContracts
      - run: docker compose exec -T -e COMMANDER_COLORS_REPORT=/tmp/commander-colors.json forge-runner node scripts/commander-colors-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/commander-colors.json > data/commander-colors.json
      - run: docker compose exec -T -e BO3_REPORT=/tmp/bo3-engine-report.json forge-runner node scripts/bo3-engine-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/bo3-engine-report.json > data/bo3-engine-smoke.json
      - run: docker compose exec -T -e COMPANION_REPORT=/tmp/companion-report.json forge-runner node scripts/companion-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/companion-report.json > data/companion-smoke.json
      - run: node scripts/smoke.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/commander-smoke.mjs
      - run: node scripts/pods-smoke.mjs
      - run: node scripts/pod-selection-smoke.mjs
      - run: node scripts/duel-smoke.mjs
      - run: node scripts/pods-browser.mjs
      - run: node scripts/formats-smoke.mjs
      - run: node scripts/formats-browser.mjs
      - run: node scripts/bo3-smoke.mjs
      - run: node scripts/bo3-browser.mjs
      - run: node scripts/feeds-smoke.mjs
      - run: node scripts/feeds-browser.mjs
      - run: node scripts/selection-smoke.mjs
      - run: node scripts/selection-browser.mjs
      - run: docker compose exec -T -e OPERATIONS_REPORT=/tmp/operations-engine.json forge-runner node scripts/operations-engine-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/operations-engine.json > data/operations-engine.json
      - run: node scripts/daily-meta-smoke.mjs
      - run: node scripts/daily-meta-browser.mjs
      - run: docker compose exec -T -e BO3_MATCHES=1 forge-runner node scripts/daily-meta-bo3-smoke.mjs
      - run: docker compose exec -T forge-runner cat /tmp/daily-meta-bo3.json > data/daily-meta-bo3.json
      - run: node scripts/maintenance-smoke.mjs
      - run: node scripts/recovery-smoke.mjs
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-evidence
          path: |
            compose.log
            data/smoke-report.json
            data/browser/
            data/formats-smoke.json
            data/bridge-smoke.json
            data/pods-smoke.json
            data/pod-selection-smoke.json
            data/duel-smoke.json
            data/bo3-engine-smoke.json
            data/companion-smoke.json
            data/bo3-smoke.json
            data/feeds-smoke.json
            data/selection-smoke.json
            data/operations-engine.json
            data/maintenance-smoke.json
            data/recovery-smoke.json
            data/commander-colors.json
            data/daily-metagame-report.json
            data/runtime-pinning.json
            data/daily-meta-bo3.json
      - if: always()
        run: docker compose down
