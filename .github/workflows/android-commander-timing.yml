name: Android · Commander game duration
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Number of sequential four-player games (1–20; total budget below 3.6 hours)
        type: number
        default: 5
      clock_seconds:
        description: Per-game diagnostic ceiling in seconds (300–3600)
        type: number
        default: 1800
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - name: Build timing APK and instrumented experiment
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Collect APKs
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/artifacts/
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use current tools for minor-version Android images
        run: |
          sdkmanager "cmdline-tools;23.0"
          python3 - <<'PYTOOLS'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['ANDROID_HOME'])/'cmdline-tools'
          latest=root/'latest'
          if latest.is_symlink():latest.unlink()
          elif latest.exists():shutil.rmtree(latest)
          latest.symlink_to(root/'23.0',target_is_directory=True)
          PYTOOLS
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
      - name: Measure real four-player Commander games
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          TIMING_SAMPLES: ${{ inputs.samples }}
          TIMING_CLOCK: ${{ inputs.clock_seconds }}
        with:
          api-level: '35'
          target: default
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          cores: 4
          ram-size: 6144M
          heap-size: 768M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 android/tools/run_commander_timing.py android/artifacts android/artifacts/commander-timing "$TIMING_SAMPLES" "$TIMING_CLOCK"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-commander-duration
          path: android/artifacts/commander-timing
          retention-days: 30
