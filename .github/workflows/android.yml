name: Android · standalone engine
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build app and tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play real Forge game on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 768M
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-engine-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
          retention-days: 14
