name: Android · standalone engine
on:
  push:
    branches: [main]
    paths: ["android/**", "engine-ai/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", "engine-ai/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publish_debug:
        description: Publish the tested APK as an Android prerelease
        type: boolean
        default: false
      release_tag:
        description: Android release tag (used when publishing)
        type: string
        default: android-v0.1.0
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - name: Determine APK version
        id: version
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_debug && inputs.release_tag || github.ref_name }}
          PUBLISH_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_debug }}
        run: |
          python3 - <<'PY'
          import os,re
          ref=os.environ['SOURCE_REF']
          if os.environ.get('PUBLISH_DEBUG') == 'true' and not ref.startswith('android-v'):raise ValueError('Publishing requires an android-vMAJOR.MINOR.PATCH tag')
          version=ref[9:] if ref.startswith('android-v') else '0.1.0'
          match=re.fullmatch(r'(\d{1,3})\.(\d{1,2})\.(\d{1,2})',version)
          if not match:raise ValueError('Android tags must use android-vMAJOR.MINOR.PATCH (minor/patch <100)')
          major,minor,patch=map(int,match.groups())
          code=major*10000+minor*100+patch+1
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write(f'version={version}\ncode={code}\n')
          PY
      - name: Build native app, unit tests and Android tests
        working-directory: android
        run: ./gradlew --no-daemon -PversionName=${{ steps.version.outputs.version }} -PversionCode=${{ steps.version.outputs.code }} assembleDebug assembleDebugAndroidTest assembleRelease testDebugUnitTest lintDebug
      - name: Check shared AI decision journal
        run: python3 engine-ai/tools/check.py --forge-jar android/engine/build/upstream.jar
      - name: Collect APKs and signing tool
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/artifacts/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/artifacts/
      - name: Build an older-version package for the in-place upgrade test
        working-directory: android
        env:
          CURRENT_CODE: ${{ steps.version.outputs.code }}
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREVIOUS_CODE=$((CURRENT_CODE > 1 ? CURRENT_CODE - 1 : 1))
          ./gradlew --no-daemon -PversionName="${CURRENT_VERSION}-upgrade-probe" -PversionCode="$PREVIOUS_CODE" assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/upgrade-probe.apk
      - name: Verify the persistent debug signing identity
        run: python3 android/tools/verify_debug_signing.py android/artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apks
          path: android/artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports
          retention-days: 14
  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '26'
            target: google_apis
          - api: '35'
            # Full AOSP image avoids Pixel Launcher's background ANR overlay in CI.
            target: default
          - api: '37.2'
            target: google_apis_ps16k
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-apks
          path: android/artifacts
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use current tools for minor-version Android images
        run: |
          sdkmanager "cmdline-tools;23.0"
          python3 - <<'PYTOOLS'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['ANDROID_HOME'])/'cmdline-tools'
          latest=root/'latest'
          if latest.is_symlink():latest.unlink()
          elif latest.exists():shutil.rmtree(latest)
          latest.symlink_to(root/'23.0',target_is_directory=True)
          PYTOOLS
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
      - name: Fetch the published persistent-key upgrade baseline
        if: ${{ fromJSON(needs.build.outputs.code) > 104 }}
        run: |
          python3 android/tools/fetch_upgrade_baseline.py android/artifacts/upgrade-probe.apk
          python3 android/tools/verify_debug_signing.py android/artifacts
      - name: Verify real engine and native UI on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          cores: 4
          ram-size: 6144M
          heap-size: 768M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu software -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 android/tools/run_instrumentation.py android/artifacts android/artifacts/acceptance
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-runtime-${{ matrix.api }}
          path: android/artifacts/acceptance
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_debug)
    needs: [build, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-apks
          path: artifacts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare debug APK or sign production APK
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p release
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            cp artifacts/app-debug.apk "release/MagicTester-${RELEASE_TAG}-debug.apk"
            java -jar artifacts/apksigner.jar verify --verbose --print-certs "release/MagicTester-${RELEASE_TAG}-debug.apk" > release/signing-certificate.txt
            echo 'debug=true' >> "$GITHUB_OUTPUT"
          else
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          mkdir -p release
          java -jar artifacts/apksigner.jar sign --ks "$RUNNER_TEMP/android-release.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "release/MagicTester-${RELEASE_TAG}.apk" artifacts/app-release-unsigned.apk
          java -jar artifacts/apksigner.jar verify --verbose --print-certs "release/MagicTester-${RELEASE_TAG}.apk" > release/signing-certificate.txt
          echo 'debug=false' >> "$GITHUB_OUTPUT"
          fi
          cd release
          sha256sum *.apk > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.4
        with:
          name: MagicTester ${{ inputs.release_tag || github.ref_name }} · Android
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.sign.outputs.debug == 'true' }}
          make_latest: false
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Standalone Android app. Forge runs locally on the phone; no server or Docker is required.
            First use: Setup → Set up local engine, then add your deck and opponents.
            Install the APK manually. APKs ending in `-debug.apk` are debug builds, published as prereleases.
            Debug APKs from 0.1.3 onward use a pinned, persistent development certificate and pass an in-place upgrade/data-retention test.
            Versions 0.1.0–0.1.2 used different keys: export each analysis JSON before a one-time uninstall/reinstall, then use Setup → Import exported analyses. Android cannot update those old installations to a different certificate.
            Production APKs use the persistent signing secrets when configured.
            Android 8+ is the declared minimum; the release passed real engine/UI acceptance on API 26, 35 and 37.2 (16 KiB pages).
            See android/README.md in this tag for resource requirements, update policy and known scope.
