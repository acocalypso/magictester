name: magictester
x-app: &app
  image: magictester-app
  build:
    context: .
    target: backend
  restart: unless-stopped
  init: true
  environment: &env
    DATABASE_URL: postgres://magictester:${POSTGRES_PASSWORD:-magictester-local}@postgres:5432/magictester
    REDIS_HOST: redis
    DATA_DIR: /data
    FORGE_HOME: /data/forge
    RUNNER_URL: http://forge-runner:3002
    LOG_DIR: /app/logs
    NO_PROXY: localhost,127.0.0.1,api,redis,postgres,forge-runner,worker,web,maintenance
    no_proxy: localhost,127.0.0.1,api,redis,postgres,forge-runner,worker,web,maintenance
    MAX_GAMES_PER_JOB: ${MAX_GAMES_PER_JOB:-1000}
    SIMULATION_CONCURRENCY: ${SIMULATION_CONCURRENCY:-0}
    MAX_FORGE_PROCESSES: ${MAX_FORGE_PROCESSES:-0}
    FORGE_CPUS_PER_PROCESS: ${FORGE_CPUS_PER_PROCESS:-2}
    FORGE_MEMORY_OVERHEAD_MB: ${FORGE_MEMORY_OVERHEAD_MB:-512}
    FORGE_MEMORY_RESERVE_MB: ${FORGE_MEMORY_RESERVE_MB:-0}
    FORGE_BATCH_SIZE: ${FORGE_BATCH_SIZE:-50}
    MAX_JOB_RUNTIME_SECONDS: ${MAX_JOB_RUNTIME_SECONDS:-21600}
  volumes:
    - runtime:/data:ro
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magictester
      POSTGRES_USER: magictester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magictester-local}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magictester -d magictester"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  bootstrap:
    build:
      context: .
      target: bootstrap
    environment:
      <<: *env
      NODE_EXTRA_CA_CERTS: ${RUNTIME_CA_PATH:-/etc/ssl/certs/ca-certificates.crt}
    volumes: [runtime:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
  maintenance:
    <<: *app
    image: magictester-bootstrap
    build:
      context: .
      target: bootstrap
    command: ["node", "dist/maintenance.js"]
    environment:
      <<: *env
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CARD_REFRESH_HOURS: ${CARD_REFRESH_HOURS:-24}
      FORGE_CHECK_HOURS: ${FORGE_CHECK_HOURS:-1}
      NODE_USE_ENV_PROXY: "1"
      NODE_EXTRA_CA_CERTS: ${RUNTIME_CA_PATH:-/etc/ssl/certs/ca-certificates.crt}
    volumes: [runtime:/data]
    mem_limit: 4g
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
  forge-runner:
    <<: *app
    image: magictester-runner
    build:
      context: .
      target: runner
    command: ["node", "dist/runner.js"]
    environment:
      <<: *env
      FORGE_HEAP: ${FORGE_HEAP:-1024m}
      LOG_FILE_MB: ${LOG_FILE_MB:-8}
      LOG_TOTAL_MB: ${LOG_TOTAL_MB:-512}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-500}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes: [runtime:/data:ro, forge-logs:/app/logs]
    tmpfs: ["/tmp:mode=1777,size=128m"]
    mem_limit: ${RUNNER_MEMORY:-0}
    cpus: ${RUNNER_CPUS:-0}
    stop_grace_period: 15s
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *app
    command: ["node", "dist/api.js"]
    environment:
      <<: *env
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DAILY_META_ENABLED: ${DAILY_META_ENABLED:-true}
      DAILY_META_DECKS: ${DAILY_META_DECKS:-10}
      META_FEED_HOSTS: ${META_FEED_HOSTS:-raw.githubusercontent.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_healthy }
      forge-runner: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    <<: *app
    image: magictester-web
    build:
      context: .
      target: web
    command: ["node", "apps/web/server.js"]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres:
  redis:
  runtime:
  forge-logs:
